<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сова, Гудбай</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f7f7f7; margin: 0; padding: 0; display: flex; justify-content: center; user-select: none; }
        #app { width: 100%; max-width: 430px; height: 100vh; background: white; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.05); position: relative; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; box-sizing: border-box; padding: 24px; }
        .screen.active { display: flex; }
        .app-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 2px solid #e5e5e5; margin-bottom: 20px; }
        .app-title { color: #3c3c3c; font-weight: 900; font-size: 24px; margin: 0; }
        .xp-badge { background-color: #fef4e8; color: #ff9600; padding: 6px 12px; border-radius: 12px; font-weight: bold; font-size: 16px; }
        .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .circle-btn { width: 130px; height: 130px; background-color: #58cc02; border: 6px solid #46a302; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 8px 0 #46a302; }
        .circle-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #46a302; }
        .circle-btn-text { color: white; font-weight: 900; font-size: 16px; margin-top: 4px; }
        .menu-btn { width: 100%; height: 50px; border: none; border-radius: 16px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .bottom-nav { height: 70px; border-top: 2px solid #e5e5e5; display: flex; justify-content: space-around; align-items: center; background: white; margin: auto -24px -24px -24px; width: calc(100% + 48px); }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: #afafaf; font-weight: bold; font-size: 12px; flex: 1; text-align: center; }
        .nav-item.active { color: #58cc02; }
        .progress-container { width: 100%; background: #e5e5e5; height: 16px; border-radius: 8px; overflow: hidden; margin-bottom: 24px; }
        .progress-bar { width: 0%; height: 100%; background: #58cc02; transition: width 0.2s; }
        .phrase-box { width: 100%; padding: 16px; background: #f7f7f7; border-radius: 16px; font-size: 18px; font-weight: bold; color: #3c3c3c; margin-bottom: 24px; border: 2px solid #e5e5e5; box-sizing: border-box; }
        .slots-zone { width: 100%; min-height: 60px; border-bottom: 2px solid #e5e5e5; display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; margin-bottom: 24px; }
        .tiles-zone { width: 100%; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .tile { background: white; border: 2px solid #e5e5e5; border-radius: 14px; padding: 12px 18px; font-size: 16px; font-weight: bold; color: #3c3c3c; cursor: pointer; box-shadow: 0 4px 0 #e5e5e5; }
        .tile:active { transform: translateY(2px); box-shadow: 0 2px 0 #e5e5e5; }
        .tile.used { opacity: 0.2; cursor: default; pointer-events: none; box-shadow: none; border-color: #eee; }
        .action-btn { width: 100%; height: 56px; border: none; border-radius: 16px; background: #1cb0f6; color: white; font-size: 18px; font-weight: bold; box-shadow: 0 4px 0 #1899d6; cursor: pointer; margin-top: auto; }
        .action-btn:disabled { background: #e5e5e5; color: #afafaf; box-shadow: none; cursor: default; }
        .card { width: 100%; border: 2px solid #e5e5e5; border-radius: 20px; padding: 16px; box-sizing: border-box; display: flex; align-items: center; margin-bottom: 16px; background: #f7f7f7; }
        .flashcard { width: 100%; height: 220px; background: #1cb0f6; border-radius: 24px; display: flex; justify-content: center; align-items: center; color: white; font-size: 28px; font-weight: bold; text-align: center; cursor: pointer; box-shadow: 0 8px 0 #1899d6; margin-bottom: 40px; padding: 20px; box-sizing: border-box; }
        .flashcard.back { background: #58cc02; box-shadow: 0 8px 0 #46a302; }
        .lb-item { width: 100%; display: flex; justify-content: space-between; padding: 12px 16px; border: 2px solid #e5e5e5; border-radius: 16px; margin-bottom: 8px; font-weight: bold; background: #f7f7f7; box-sizing: border-box; }
        .lb-item.me { border-color: #58cc02; background: #f1fbf0; }
    </style>
</head>
<body>
    <div id="app">
        <!-- ОБУЧЕНИЕ -->
        <div id="screen-main" class="screen active">
            <div class="app-bar"><h1 class="app-title">Сова, Гудбай</h1><div class="xp-badge">⚡ <span class="xp-val">0</span> XP</div></div>
            <div class="content">
                <button class="menu-btn" style="background:#ffc107; color:white; box-shadow: 0 4px 0 #d39e00;" onclick="openLeaderboard()">🏆 РЕЙТИНГ ЛИГИ</button>
                <div style="height: 20px;"></div>
                <div class="circle-btn" onclick="startLesson()"><span style="font-size:40px">🦉</span><span class="circle-btn-text">СТАРТ</span></div>
                <h2 style="color:#3c3c3c; margin-top:24px; text-align:center;">Привет, <span class="name-val">Честный Студент</span>!</h2>
                <p style="color:#777; margin:0; text-align:center;">Пройдено сессий: <span id="comp-lessons">0</span></p>
                <button class="menu-btn" style="background:white; color:#1cb0f6; border:2px solid #1cb0f6; box-shadow:0 4px 0 #1cb0f6; margin-top:40px;" onclick="startFlashcards()">🎴 УЧИТЬ КАРТОЧКИ</button>
            </div>
            <div class="bottom-nav">
                <div class="nav-item active" onclick="showScreen('screen-main')">📚 Обучение</div>
                <div class="nav-item" onclick="showScreen('screen-prof')">👤 Профиль</div>
                <div class="nav-item" onclick="showScreen('screen-shop')">🛒 Магазин</div>
            </div>
        </div>

        <!-- ТЕСТ -->
        <div id="screen-test" class="screen">
            <div class="app-bar"><h1 class="app-title" id="test-title">Шаг 1 из 7</h1></div>
            <div class="progress-container"><div id="p-bar" class="progress-bar"></div></div>
            <div class="phrase-box">🦉 <span id="ru-prompt">...</span></div>
            <div class="slots-zone" id="slots"></div>
            <div class="tiles-zone" id="tiles"></div>
            <div id="feedback" style="margin-top:20px; font-size:18px; font-weight:bold; text-align:center; height:30px;"></div>
            <button id="check-btn" class="action-btn" onclick="checkAnswer()" disabled>ПРОВЕРИТЬ ОТВЕТ</button>
        </div>

        <!-- КАРТОЧКИ -->
        <div id="screen-cards" class="screen">
            <div class="app-bar"><h1 class="app-title">Карточки слов</h1></div>
            <div style="text-align:center; color:#777; font-weight:bold; margin-bottom:20px;" id="card-index">Карточка 1 из 5</div>
            <div class="content">
                <div id="f-card" class="flashcard" onclick="flipCard()">Word</div>
                <div style="display:flex; gap:16px; width:100%;">
                    <button class="action-btn" style="background:#e5e5e5; color:#3c3c3c; box-shadow:none;" onclick="showScreen('screen-main')">ВЫХОД</button>
                    <button class="action-btn" id="card-next" onclick="nextCard()">ДАЛЬШЕ</button>
                </div>
            </div>
        </div>

        <!-- РЕЙТИНГ -->
        <div id="screen-lb" class="screen">
            <div class="app-bar"><h1 class="app-title">Лига лидеров</h1><button class="tile" style="padding:4px 8px; box-shadow:none;" onclick="showScreen('screen-main')">✖</button></div>
            <div id="lb-list" style="overflow-y:auto; flex:1; width:100%;"></div>
        </div>

        <!-- ПРОФИЛЬ -->
        <div id="screen-prof" class="screen">
            <div class="app-bar"><h1 class="app-title">Мой Профиль</h1></div>
            <div class="card">
                <div class="avatar" style="font-size:30px;">👑</div>
                <div style="margin-left:16px; flex:1;">
                    <div style="font-size:20px; font-weight:bold; color:#3c3c3c; display:flex; align-items:center;">
                        <span class="name-val">Честный Студент</span>
                        <button style="background:none; border:none; color:#58cc02; cursor:pointer; font-size:16px; margin-left:8px;" onclick="editName()">✏️</button>
                    </div>
                    <div style="color:#58cc02; font-weight:bold; margin-top:4px;">Ранг: Уровень <span id="prof-lvl">1</span></div>
                </div>
            </div>
            <div style="display:flex; gap:16px; width:100%; margin-top:16px;">
                <div class="stat-box" style="flex:1; border:2px solid #e5e5e5; border-radius:16px; padding:16px; text-align:center;"><div style="font-size:24px; font-weight:bold; color:orange;" class="xp-val">0</div><div style="color:#777; font-weight:bold; font-size:14px;">Очки XP</div></div>
                <div class="stat-box" style="flex:1; border:2px solid #e5e5e5; border-radius:16px; padding:16px; text-align:center;"><div style="font-size:24px; font-weight:bold; color:#58cc02;" id="prof-lessons">0</div><div style="color:#777; font-weight:bold; font-size:14px;">Уроки</div></div>
            </div>
            <div class="bottom-nav">
                <div class="nav-item" onclick="showScreen('screen-main')">📚 Обучение</div>
                <div class="nav-item active" onclick="showScreen('screen-prof')">👤 Профиль</div>
                <div class="nav-item" onclick="showScreen('screen-shop')">🛒 Магазин</div>
            </div>
        </div>

        <!-- МАГАЗИН -->
